org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official

# File-system watching is a performance optimisation only; it relies on native
# watchers that are unreliable in sandboxed or containerised checkouts. Disabled
# here so up-to-date checks always re-stat inputs.
#
# NOTE: this setting was once blamed for a "build did not pick up my change"
# problem that turned out not to exist. Before concluding a build is stale,
# verify with real evidence — see docs/development-handbook.md §8.5.
org.gradle.vfs.watch=false
